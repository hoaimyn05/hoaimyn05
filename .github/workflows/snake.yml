name: Generate profile stats and snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render stats and activity graph
        run: node .github/scripts/activity.mjs ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff5e1a&color_dots=#ebedf0,#ffd8b8,#ffb27a,#ff8a3d,#c2410c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff9a3d&color_dots=#161b22,#5a2a12,#9a3f12,#ff5e1a,#ffc46b
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
