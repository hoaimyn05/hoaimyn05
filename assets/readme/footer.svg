<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Research, engineer, deploy"><title>Research, engineer, deploy</title><defs>
<linearGradient id="sunset" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5e1a"/><stop offset=".5" stop-color="#ff9a3d"/><stop offset=".78" stop-color="#ffc46b"/><stop offset="1" stop-color="#86a8d8"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset=".1" stop-color="#fff6ec"/><stop offset=".55" stop-color="#ffc48a"/><stop offset="1" stop-color="#ff6a1f"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#f1e4d6"/><stop offset="1" stop-color="#b7a594"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e1a"/><stop offset="1" stop-color="#ffb35c"/></linearGradient>
<linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16131a"/><stop offset=".6" stop-color="#121016"/><stop offset="1" stop-color="#1a110b"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".018"/></pattern>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".05"/></pattern>
<style>@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}.f-SG{font-family:'Space Grotesk',sans-serif;font-weight:700}.f-IN{font-family:'Inter',sans-serif}.f-JB{font-family:'JetBrains Mono',monospace;font-weight:500}.f-IS{font-family:'Instrument Serif',serif;font-style:italic}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}
.flow{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-28}}
.scanline{animation:scanl 3.2s ease-in-out infinite}@keyframes scanl{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d,200px))}}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs><path d="M0 45H1200" stroke="#2b2520"/><rect x="0" y="43" width="300" height="4" fill="url(#sunset)"/><text x="600" y="52" class="f-JB" font-size="14" fill="#a7a09b" text-anchor="middle" letter-spacing="3">RESEARCH → ENGINEER → DEPLOY · HO CHI MINH CITY</text></svg>